# Publishes a release of the starter when a version tag is pushed:
#
#   1. bump VERSION and commit it
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# The release carries the repository at the tagged commit as a tarball shaped
# like GitHub's own (one top-level directory), its SHA-256, and a build
# provenance attestation tying the tarball to this workflow and commit. The
# panel gives new static sites built with AI the newest release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=VERSION::Tag $GITHUB_REF_NAME does not match VERSION $version."
            exit 1
          fi

      - name: Package the release
        run: |
          name="static-simply-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_SHA"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release drafted in GitHub's interface creates the tag, which is what
        # runs this, so the release may already be there: it is given the
        # assets then. An asset already on it is never replaced (no --clobber).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
